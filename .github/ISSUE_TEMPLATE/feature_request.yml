name: Feature request
description: Propose new behavior that does not change the wire contract.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that solves it. If it changes REST, MCP tools, events or CLI exit codes, use the contract change template instead.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: New inputs, outbound requests, stored data or privileges this would add.
